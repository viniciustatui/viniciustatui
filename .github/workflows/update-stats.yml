name: Update README cards
on:
  schedule:
    - cron: "0 3 * * *" # Todo dia às 3am
  workflow_dispatch:    # Botão manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Gera Stats (Geral)
      - name: Generate Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: stats
          options: username=viniciustatui&show_icons=true&theme=dracula&include_all_commits=true&count_private=true&hide_border=true&locale=pt-br&title_color=2F80ED&icon_color=FFCA28&text_color=FFFFFF
          path: profile/stats.svg

      # 2. Gera Linguagens
      - name: Generate Top Langs
        uses: readme-tools/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: top-langs
          options: username=viniciustatui&layout=compact&theme=dracula&hide_border=true&locale=pt-br&title_color=2F80ED&icon_color=FFCA28&text_color=FFFFFF
          path: profile/top-langs.svg

      # 3. Salva de forma inteligente (Usa uma Action profissional de commit)
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update README stats [skip ci]"
          file_pattern: 'profile/*.svg'
